services:
  # 1. Barramento de Eventos e Mensageria (Core Jarvis)
  redis:
    image: redis:7-alpine
    container_name: laus_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - laus_network

  # 2. Banco Vetorial para Memória Episódica e GraphRAG (Pilar 5)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: laus_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - laus_network

  # 3. PostgreSQL com suporte a Ledger e Estado Relacional (Pilar 8)
  postgres:
    image: postgres:15-alpine
    container_name: laus_postgres
    environment:
      POSTGRES_USER: laus_user
      POSTGRES_PASSWORD: laus_secure_password
      POSTGRES_DB: laus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - laus_network

  # 4. Motor Quantitativo de Execução e Backtest (Pilar 2 - Freqtrade)
  laus_freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: laus_freqtrade
    volumes:
      - ./agents_quant/freqtrade_engine:/freqtrade/user_data
    ports:
      - "8080:8080"
    command: ["trade", "--config", "/freqtrade/user_data/config.json", "--strategy", "DefaultStrategy"]
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - laus_network

  # 5. Observabilidade, Telemetria e Feature Flags (Pilar 4 - PostHog Local)
  posthog:
    image: posthog/posthog:latest
    container_name: laus_posthog
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://laus_user:laus_secure_password@postgres:5432/laus_db
      - REDIS_URL=redis://redis:6379/0
      - SITE_URL=http://localhost:8000
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    networks:
      - laus_network

volumes:
  qdrant_storage:
  postgres_data:

networks:
  laus_network:
    driver: bridge