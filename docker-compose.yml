version: '3.9'

networks:
  laus-mesh:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  qdrant-data:

services:
  # Pilar 1: Barramento de Eventos Assíncrono (Redis Streams)
  event-bus:
    image: redis:7-alpine
    container_name: laus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - laus-mesh
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Pilar 8: Banco Contábil Relacional (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: laus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-laus_ledger}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - laus-mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Pilar 5: Memória Episódica & GraphRAG (Qdrant Vector DB)
  vector-store:
    image: qdrant/qdrant:latest
    container_name: laus-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - laus-mesh

  # Pilar 4: Telemetria & Auditoria Analítica (PostHog Self-Hosted)
  telemetry:
    image: posthog/posthog:latest
    container_name: laus-posthog
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - IS_BEHIND_PROXY=false
    networks:
      - laus-mesh

  # Pilar 4: Console UI & Dashboard de Observabilidade
  console_ui:
    image: python:3.11-slim
    container_name: laus-console
    restart: unless-stopped
    volumes:
      - .:/app
    working_dir: /app
    command: python -m uvicorn console_ui.server:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    environment:
      - LAUS_ENVIRONMENT=homologation
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/laus_ledger
    networks:
      - laus-mesh
    depends_on:
      - postgres

  # Pilar 1: Orquestrador Cognitivo Jarvis Core
  core_jarvis:
    image: python:3.11-slim
    container_name: laus-jarvis
    restart: unless-stopped
    volumes:
      - .:/app
    working_dir: /app
    command: python core_jarvis/orchestrator.py
    environment:
      - LAUS_ENVIRONMENT=homologation
      - REDIS_URL=redis://event-bus:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/laus_ledger
    depends_on:
      event-bus:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - laus-mesh
